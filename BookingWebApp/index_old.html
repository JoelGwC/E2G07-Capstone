<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Booking Manager</title>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>
    <style>
      :root {
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-main: #111827;
        --text-secondary: #6b7280;
        --border-color: #e5e7eb;
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --danger-color: #ef4444;
        --success-color: #10b981;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --radius: 12px;
      }

      [data-theme="dark"] {
        --bg-color: #111827;
        --card-bg: #1f2937;
        --text-main: #f9fafb;
        --text-secondary: #9ca3af;
        --border-color: #374151;
        --primary-color: #6366f1;
        --primary-hover: #818cf8;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      }

      [data-theme="dark"] ::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 500px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }
      h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-secondary);
      }
      input[type="text"],
      input[type="number"],
      input[type="datetime-local"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin-bottom: 1.25rem;
        font-size: 1rem;
        box-sizing: border-box;
      }

      .btn {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
      }
      .btn-primary {
        background-color: var(--primary-color);
        color: white;
      }
      .btn-google {
        background-color: white;
        color: #374151;
        border: 1px solid #d1d5db;
      }
      .btn-logout {
        background-color: transparent;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
        width: auto;
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
      }

      .hidden {
        display: none !important;
      }
      .result-box {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 8px;
        background-color: rgba(16, 185, 129, 0.1);
        color: var(--success-color);
        border: 1px solid var(--success-color);
        text-align: center;
      }
      .result-box.error {
        background-color: rgba(239, 68, 68, 0.1);
        color: var(--danger-color);
        border-color: var(--danger-color);
      }

      .timer-badge {
        background: rgba(0, 0, 0, 0.1);
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 15px;
        display: inline-block;
        font-size: 0.95rem;
        color: #333;
      }

      /* === NEW TOGGLE SWITCH STYLES === */
      .toggle-wrapper {
        display: flex;
        flex-direction: column;
        align-items: left;
        justify-content: left;
        margin: 1.5rem 0;
      }

      .toggle-label-text {
        margin-bottom: 10px;
        font-weight: 600;
        color: var(--text-main);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 34px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--primary-color);
      }

      input:focus + .slider {
        box-shadow: 0 0 1px var(--primary-color);
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }
    </style>
  </head>
  <body>
    <div class="card" id="login-section">
      <div class="header">
        <h2>User Portal</h2>
        <button
          onclick="toggleTheme()"
          style="
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
          "
        >
          🌓
        </button>
      </div>
      <p>Sign in to manage room access.</p>
      <button class="btn btn-google" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        Sign in with Google
      </button>
      <p
        id="login-error"
        style="
          color: var(--danger-color);
          margin-top: 1rem;
          text-align: center;
          display: none;
        "
      ></p>
    </div>

    <div class="card hidden" id="dashboard">
      <div class="header">
        <div>
          <h2>Create Booking</h2>
          <div
            style="
              font-size: 0.85rem;
              color: var(--text-secondary);
              margin-top: 5px;
            "
          >
            User: <span id="user-email">...</span>
          </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <button
            onclick="toggleTheme()"
            style="
              background: none;
              border: none;
              cursor: pointer;
              font-size: 1.2em;
            "
          >
            🌓
          </button>
          <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <hr
        style="
          border: 0;
          border-top: 1px solid var(--border-color);
          margin-bottom: 1.5rem;
        "
      />

      <label>Select Room ID</label>
      <input
        type="text"
        id="roomIdInput"
        value="room_001"
        readonly
        style="opacity: 0.7; cursor: not-allowed"
      />

      <label>Capacity</label>
      <input
        type="text"
        id="roomCapacity"
        value="50"
        readonly
        style="opacity: 0.7; cursor: not-allowed"
      />

      <label>Start Date & Time</label>
      <input type="datetime-local" id="startDateTime" />

      <label>Duration (Minutes)</label>
      <input type="number" id="durationHours" min="1" value="1" />

      <div class="toggle-wrapper">
        <span class="toggle-label-text">Lights</span>
        <label class="switch">
          <input type="checkbox" id="includeLights" />
          <span class="slider round"></span>
        </label>
      </div>

      <button class="btn btn-primary" onclick="createBooking()">
        Generate Access PIN
      </button>

      <div id="booking-result" class="result-box hidden"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getDatabase,
        ref,
        set,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      // === 1. EMAILJS CONFIGURATION (FILL THESE IN) ===
      const EMAILJS_SERVICE_ID = "service_bxvgznl"; // e.g. service_xyz
      const EMAILJS_TEMPLATE_ID = "template_rm8b4or"; // e.g. template_abc
      const EMAILJS_PUBLIC_KEY = "tTukxfNhCFbPnEX2O"; // e.g. user_123

      // === YOUR CONFIGURATION ===
      const firebaseConfig = {
        apiKey: "AIzaSyB0XjpqmXA7wab9EBNvzo-8abHxjJnDqdk",
        authDomain: "localtest-0327.firebaseapp.com",
        databaseURL:
          "https://localtest-0327-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "localtest-0327",
        storageBucket: "localtest-0327.firebasestorage.app",
        messagingSenderId: "619374002435",
        appId: "1:619374002435:web:c66e8326a677a71bf22936",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      const database = getDatabase(app);

      // Initialize EmailJS
      emailjs.init(EMAILJS_PUBLIC_KEY);

      // === GLOBAL VARIABLES ===
      let timerInterval = null;
      let activeListener = null;

      // === AUTH LOGIC ===
      const loginSection = document.getElementById("login-section");
      const dashboard = document.getElementById("dashboard");
      const userEmailSpan = document.getElementById("user-email");
      const loginError = document.getElementById("login-error");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          loginSection.classList.add("hidden");
          dashboard.classList.remove("hidden");
          userEmailSpan.textContent = user.email;
        } else {
          loginSection.classList.remove("hidden");
          dashboard.classList.add("hidden");
        }
      });

      window.loginWithGoogle = () => {
        signInWithPopup(auth, provider).catch((error) => {
          loginError.style.display = "block";
          loginError.textContent = "Login Failed: " + error.message;
        });
      };

      window.logout = () => signOut(auth);

      // === BOOKING LOGIC ===
      window.createBooking = () => {
        const roomId = document.getElementById("roomIdInput").value;
        const startDTStr = document.getElementById("startDateTime").value;
        const duration = parseInt(
          document.getElementById("durationHours").value
        );
        const emailRecipient = auth.currentUser.email;
        const useLights = document.getElementById("includeLights").checked;
        const resultDiv = document.getElementById("booking-result");

        resultDiv.className = "result-box hidden";
        if (timerInterval) clearInterval(timerInterval);
        if (activeListener) activeListener();

        if (!startDTStr || !duration) {
          resultDiv.textContent = "Please set a start time and duration.";
          resultDiv.classList.remove("hidden");
          resultDiv.classList.add("error");
          return;
        }

        const startDate = new Date(startDTStr);
        const startTimestamp = Math.floor(startDate.getTime() / 1000);
        const endTimestamp = startTimestamp + duration * 60; //* 3600 to make it in seconds
        const pinCode = Math.floor(100000 + Math.random() * 900000).toString();

        const bookingPath = "rooms/" + roomId + "/active_codes/" + pinCode;
        const dbRef = ref(database, bookingPath);

        set(dbRef, {
          start_time: startTimestamp,
          end_time: endTimestamp,
          use_lights: useLights,
          created_by: auth.currentUser.email,
          created_at: Math.floor(Date.now() / 1000),
          has_checked_in: false,
        })
          .then(() => {
            resultDiv.innerHTML = `
            <strong>Booking Successful!</strong><br>
            PIN: <span style="font-size: 1.4em; font-weight:800; display:block; margin:5px 0;">${pinCode}</span>
            Valid: ${startDate.toLocaleString()} (${duration}min)
            <br>
            <div id = "email-msg" style="margin-top:5px; font-size:0.9em; color:#666;">Sending Email...</div>
            <div id="timer-display" class="timer-badge">Loading Timer...</div>
          `;
            resultDiv.classList.remove("hidden", "error");

            startLiveCountdown(startTimestamp);
            monitorCheckInStatus(dbRef);
            // === SEND EMAIL ===
            const emailParams = {
              to_email: emailRecipient,
              pin_code: pinCode,
              start_time: startDate.toLocaleString(),
              duration: duration + " minutes",
            };

            emailjs
              .send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, emailParams)
              .then(
                () => {
                  console.log("Email Sent!");
                  const emailMsgDiv = document.getElementById("email-msg");
                  if (emailMsgDiv) {
                    emailMsgDiv.innerHTML = "Email Sent! ✅";
                    emailMsgDiv.style.color = "var(--success-color)";
                    emailMsgDiv.style.fontWeight = "bold";
                  }
                },
                (err) => {
                  const emailMsgDiv = document.getElementById("email-msg");
                  if (emailMsgDiv) {
                    emailMsgDiv.innerHTML = "Email Failed. Check Console.";
                    emailMsgDiv.style.color = "var(--danger-color)";
                  }
                }
              );
          })
          .catch((error) => {
            resultDiv.textContent = "Database Error: " + error.message;
            resultDiv.classList.remove("hidden");
            resultDiv.classList.add("error");
          });
      };

      function monitorCheckInStatus(dbRef) {
        activeListener = onValue(dbRef, (snapshot) => {
          const data = snapshot.val();
          if (data && data.has_checked_in === true) {
            clearInterval(timerInterval);
            const timerDisplay = document.getElementById("timer-display");
            if (timerDisplay) {
              timerDisplay.innerHTML = "✅ Guest Successfully Checked In";
              timerDisplay.style.background = "#d1fae5";
              timerDisplay.style.color = "#065f46";
              timerDisplay.style.border = "1px solid #065f46";
            }
          }
        });
      }

      function startLiveCountdown(startTimestamp) {
        const timerDisplay = document.getElementById("timer-display");
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);

        function updateTimer() {
          const now = Math.floor(Date.now() / 1000);
          const checkInLimit = startTimestamp + 3 * 60;

          if (now < startTimestamp) {
            const diff = startTimestamp - now;
            timerDisplay.innerHTML = `⏳ Booking Starts in: ${formatTime(
              diff
            )}`;
            timerDisplay.style.background = "#fff3cd";
            timerDisplay.style.color = "#856404";
          } else if (now >= startTimestamp && now < checkInLimit) {
            const diff = checkInLimit - now;
            timerDisplay.innerHTML = `⚠️ Check-in Deadline: ${formatTime(
              diff
            )}`;
            timerDisplay.style.background = "#f8d7da";
            timerDisplay.style.color = "#721c24";
          } else {
            timerDisplay.innerHTML = "❌ Check-in Expired";
            timerDisplay.style.background = "#000";
            timerDisplay.style.color = "#fff";
            clearInterval(timerInterval);
          }
        }
      }

      function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h > 0) return `${h}h ${m}m ${s}s`;
        return `${m}m ${s}s`;
      }

      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
        document.body.setAttribute("data-theme", "dark");
      }

      window.toggleTheme = () => {
        if (document.body.getAttribute("data-theme") === "dark") {
          document.body.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        } else {
          document.body.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        }
      };
    </script>
  </body>
</html>
