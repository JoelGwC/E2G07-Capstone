<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking Manager</title>
    <style>
        :root {
            /* Light Theme Variables */
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        
        /* === THE FIX FOR CALENDAR ICON === */
        /* This manually inverts the colors of the calendar icon when in dark mode */
        [data-theme="dark"] ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h2 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        p { color: var(--text-secondary); margin-bottom: 1.5rem; }

        /* Form Elements */
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="number"], input[type="datetime-local"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin-bottom: 1.25rem;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-google {
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-google:hover { background-color: #f9fafb; }
        [data-theme="dark"] .btn-google { background-color: #374151; color: white; border-color: #4b5563; }
        [data-theme="dark"] .btn-google:hover { background-color: #4b5563; }

        .btn-logout { 
            background-color: transparent; 
            color: var(--danger-color); 
            border: 1px solid var(--danger-color);
            width: auto;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .btn-logout:hover { background-color: rgba(239, 68, 68, 0.1); }

        /* Toggle Switch */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 50%;
        }
        .theme-toggle:hover { background-color: rgba(128, 128, 128, 0.1); }

        /* Utility */
        .hidden { display: none !important; }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            text-align: center;
        }
        .result-box.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Checkbox styling */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: var(--primary-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card" id="login-section">
    <div class="header">
        <h2>User Portal</h2>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌓</button>
    </div>
    <p>Sign in to manage room access and bookings.</p>
    
    <button class="btn btn-google" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
    </button>
    <p id="login-error" style="color: var(--danger-color); margin-top: 1rem; text-align: center; display: none;"></p>
</div>

<div class="card hidden" id="dashboard">
    <div class="header">
        <div>
            <h2>Create Booking</h2>
            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">
                User: <span id="user-email">...</span>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 1.5rem;">

    <label>Select Room ID</label>
    <input type="text" id="roomIdInput" value="room_001" readonly style="opacity: 0.7; cursor: not-allowed;">
    
    <label>Start Date & Time</label>
    <input type="datetime-local" id="startDateTime">

    <label>Duration (Hours)</label>
    <input type="number" id="durationHours" min="1" value="1">
    
    <div class="checkbox-wrapper" onclick="document.getElementById('includeLights').click()">
        <input type="checkbox" id="includeLights">
        <label for="includeLights" style="margin:0; cursor: pointer;">Turn on lights automatically</label>
    </div>

    <button class="btn btn-primary" onclick="createBooking()">
        Generate Access PIN
    </button>

    <div id="booking-result" class="result-box hidden"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // === YOUR CONFIGURATION ===
  const firebaseConfig = {
    apiKey: "AIzaSyB0XjpqmXA7wab9EBNvzo-8abHxjJnDqdk",
    authDomain: "localtest-0327.firebaseapp.com",
    databaseURL: "https://localtest-0327-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "localtest-0327",
    storageBucket: "localtest-0327.firebasestorage.app",
    messagingSenderId: "619374002435",
    appId: "1:619374002435:web:c66e8326a677a71bf22936",
  };

  // Initialize
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider(); // Helper for Google Login
  const database = getDatabase(app);

  // === AUTHENTICATION LOGIC ===
  const loginSection = document.getElementById('login-section');
  const dashboard = document.getElementById('dashboard');
  const userEmailSpan = document.getElementById('user-email');
  const loginError = document.getElementById('login-error');

  // Monitor login status
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.classList.add('hidden');
      dashboard.classList.remove('hidden');
      userEmailSpan.textContent = user.email;
    } else {
      loginSection.classList.remove('hidden');
      dashboard.classList.add('hidden');
    }
  });

  // Expose function to global window scope so HTML buttons can see them
  window.loginWithGoogle = () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        // Successful login
        console.log("Logged in as:", result.user.email);
      }).catch((error) => {
        loginError.style.display = 'block';
        loginError.textContent = "Login Failed: " + error.message;
      });
  };

  window.logout = () => {
    signOut(auth);
  };

  // === BOOKING LOGIC ===
  window.createBooking = () => {
      const roomId = document.getElementById('roomIdInput').value;
      const startDTStr = document.getElementById('startDateTime').value;
      const duration = parseInt(document.getElementById('durationHours').value);
      const useLights = document.getElementById('includeLights').checked;
      const resultDiv = document.getElementById('booking-result');

      // Reset result box
      resultDiv.className = "result-box hidden"; 

      if(!startDTStr || !duration) {
          resultDiv.textContent = "Please set a start time and duration.";
          resultDiv.classList.remove('hidden');
          resultDiv.classList.add('error');
          return;
      }

      const startDate = new Date(startDTStr);
      const startTimestamp = Math.floor(startDate.getTime() / 1000);
      const endTimestamp = startTimestamp + (duration * 3600);
      const pinCode = Math.floor(100000 + Math.random() * 900000).toString();

      const dbRef = ref(database, 'rooms/' + roomId + '/active_codes/' + pinCode);

      set(dbRef, {
          start_time: startTimestamp,
          end_time: endTimestamp,
          use_lights: useLights,
          created_by: auth.currentUser.email, // We can now save who made the booking!
          created_at: Math.floor(Date.now()/1000)
      })
      .then(() => {
          resultDiv.innerHTML = `
            <strong>Booking Successful!</strong><br>
            PIN: <span style="font-size: 1.4em; font-weight:800; display:block; margin:5px 0;">${pinCode}</span>
            Valid: ${startDate.toLocaleString()} (${duration}h)
          `;
          resultDiv.classList.remove('hidden', 'error');
      })
      .catch((error) => {
           resultDiv.textContent = "Database Error: " + error.message;
           resultDiv.classList.remove('hidden');
           resultDiv.classList.add('error');
      });
  };

  // === THEME LOGIC (Dark Mode) ===
  // 1. Check local storage or system preference on load
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.body.setAttribute('data-theme', 'dark');
  }

  window.toggleTheme = () => {
      if (document.body.getAttribute('data-theme') === 'dark') {
          document.body.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
      } else {
          document.body.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
      }
  };
</script>
</body>
</html>
