<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Room Access</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg-color: #000000;
        --card-color: #212424;
        --accent-color: #10a210;
        --busy-color: #d00000;
        --text-color: #ffffff;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* Fluid Card Width */
      .card {
        background-color: var(--card-color);
        border-radius: 12px;
        width: 100%; /* Force full width */
      }

      /* Keypad Button Styling - Responsive scaling */
      .key-btn {
        background-color: var(--card-color);
        color: white;
        font-size: 2rem; /* Larger text for big screens */
        font-weight: bold;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s;
        box-shadow: 0 4px 0 #1a1c1c;
        height: 100%; /* Fill grid cell */
        width: 100%;
      }
      .key-btn:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      /* Modal Animation */
      .modal-enter {
        opacity: 0;
        transform: scale(0.9);
      }
      .modal-enter-active {
        opacity: 1;
        transform: scale(1);
        transition: all 0.2s ease-out;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 6px;
        border: 2px solid #111;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body class="h-screen w-screen flex flex-col overflow-hidden">
    <header
      class="w-full p-5 border-b border-gray-800 bg-[#212424] flex justify-between items-center shrink-0 z-50 shadow-md"
    >
      <div>
        <h1 id="roomName" class="text-2xl md:text-3xl font-bold tracking-wider">
          LOADING...
        </h1>
        <p id="clock" class="text-sm md:text-base text-gray-400 mt-1">--:--</p>
      </div>
      <div
        id="statusBadge"
        class="bg-gray-600 px-6 py-2 rounded-full text-sm md:text-base font-bold tracking-wide shadow-sm"
      >
        ...
      </div>
    </header>

    <nav
      class="w-full flex p-3 gap-4 bg-black shrink-0 border-b border-gray-800 z-40"
    >
      <button
        onclick="switchTab('schedule')"
        id="tab-schedule"
        class="flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#10A210] text-white transition shadow-lg tracking-wide uppercase"
      >
        <i class="fa-regular fa-calendar-days mr-2"></i> Schedule
      </button>
      <button
        onclick="switchTab('keypad')"
        id="tab-keypad"
        class="flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#212424] text-gray-400 transition shadow-lg tracking-wide uppercase"
      >
        <i class="fa-solid fa-calculator mr-2"></i> Enter PIN
      </button>
    </nav>

    <main class="flex-1 w-full relative overflow-hidden bg-black">
      <div id="view-schedule" class="h-full w-full overflow-y-auto p-4 md:p-8">
        <div id="scheduleList" class="space-y-4 max-w-5xl mx-auto"></div>
      </div>

      <div
        id="view-keypad"
        class="hidden h-full w-full flex flex-col items-center justify-center p-4"
      >
        <div class="w-full max-w-2xl flex flex-col h-full max-h-[800px]">
          <div class="mb-6 md:mb-10 w-full">
            <div
              class="h-24 md:h-32 border-4 border-gray-800 rounded-2xl flex items-center justify-center bg-[#1a1c1c] shadow-inner"
            >
              <span
                id="pinDisplay"
                class="text-5xl md:text-7xl font-mono tracking-[0.5em] text-white"
              ></span>
            </div>
            <p
              id="pinStatus"
              class="text-center text-base md:text-lg mt-3 text-gray-400 font-mono h-6"
            >
              Enter 6-digit PIN
            </p>
          </div>

          <div class="grid grid-cols-3 gap-4 md:gap-6 flex-1 w-full">
            <button class="key-btn" onclick="addPin('1')">1</button>
            <button class="key-btn" onclick="addPin('2')">2</button>
            <button class="key-btn" onclick="addPin('3')">3</button>

            <button class="key-btn" onclick="addPin('4')">4</button>
            <button class="key-btn" onclick="addPin('5')">5</button>
            <button class="key-btn" onclick="addPin('6')">6</button>

            <button class="key-btn" onclick="addPin('7')">7</button>
            <button class="key-btn" onclick="addPin('8')">8</button>
            <button class="key-btn" onclick="addPin('9')">9</button>

            <button
              class="key-btn bg-red-900/40 text-red-200 border-2 border-red-900/50 hover:bg-red-900 transition-colors"
              onclick="clearPin()"
            >
              <i class="fa-solid fa-delete-left"></i>
            </button>
            <button class="key-btn" onclick="addPin('0')">0</button>
            <button
              class="key-btn bg-green-900/40 text-green-200 border-2 border-green-900/50 hover:bg-green-900 transition-colors"
              onclick="submitPin()"
            >
              &#9166
            </button>
          </div>
        </div>
      </div>
    </main>

    <div
      id="resultModal"
      class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-300"
    >
      <div
        id="modalCard"
        class="bg-[#212424] p-10 rounded-3xl flex flex-col items-center text-center w-[90%] max-w-lg shadow-2xl border border-gray-700 transform scale-90 transition-transform duration-300"
      >
        <div
          id="modalIconBg"
          class="w-24 h-24 rounded-full flex items-center justify-center mb-6 text-5xl"
        >
          <i id="modalIcon" class="fa-solid fa-check"></i>
        </div>
        <h2 id="modalTitle" class="text-3xl font-bold mb-3 text-white">
          ACCESS GRANTED
        </h2>
        <p id="modalMsg" class="text-gray-400 text-lg mb-8">
          Door unlocked successfully.
        </p>
        <button
          onclick="closeModal()"
          class="w-full py-4 bg-gray-700 hover:bg-gray-600 rounded-xl text-white text-xl font-bold transition shadow-lg"
        >
          CLOSE
        </button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        onValue,
        set,
        get,
      } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

      // === FIREBASE CONFIG ===
      const firebaseConfig = {
        apiKey: "AIzaSyB0XjpqmXA7wab9EBNvzo-8abHxjJnDqdk",
        authDomain: "localtest-0327.firebaseapp.com",
        databaseURL:
          "https://localtest-0327-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "localtest-0327",
        storageBucket: "localtest-0327.appspot.com",
        messagingSenderId: "619374002435",
        appId: "1:619374002435:web:c66e8326a677a71bf22936",
      };

      const ROOM_ID = "room_001";
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // === STATE ===
      let currentPin = "";
      let bookings = [];

      // 1. Clock & Info
      function updateClock() {
        document.getElementById("clock").innerText =
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
      }
      setInterval(updateClock, 1000);
      updateClock();

      onValue(
        ref(db, `/rooms/${ROOM_ID}/config/name`),
        (s) =>
          (document.getElementById("roomName").innerText = (
            s.val() || "ROOM 001"
          ).toUpperCase())
      );

      // 2. Tab Logic (Simple Toggle)
      window.switchTab = (tab) => {
        const schView = document.getElementById("view-schedule");
        const keyView = document.getElementById("view-keypad");
        const schBtn = document.getElementById("tab-schedule");
        const keyBtn = document.getElementById("tab-keypad");

        if (tab === "schedule") {
          schView.classList.remove("hidden");
          keyView.classList.add("hidden");

          // Active Style
          schBtn.className =
            "flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#10A210] text-white transition shadow-lg tracking-wide uppercase ring-2 ring-[#10A210] ring-offset-2 ring-offset-black";
          schBtn.innerHTML =
            '<i class="fa-regular fa-calendar-days mr-2"></i> Schedule';

          // Inactive Style
          keyBtn.className =
            "flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#212424] text-gray-500 transition shadow-none tracking-wide uppercase hover:bg-[#2a2d2d]";
          keyBtn.innerHTML =
            '<i class="fa-solid fa-calculator mr-2"></i> Enter PIN';
        } else {
          schView.classList.add("hidden");
          keyView.classList.remove("hidden");
          keyView.classList.add("flex"); // Ensure flex is added for centering

          // Inactive Style
          schBtn.className =
            "flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#212424] text-gray-500 transition shadow-none tracking-wide uppercase hover:bg-[#2a2d2d]";
          schBtn.innerHTML =
            '<i class="fa-regular fa-calendar-days mr-2"></i> Schedule';

          // Active Style
          keyBtn.className =
            "flex-1 py-4 rounded-xl font-bold text-lg md:text-xl bg-[#10A210] text-white transition shadow-lg tracking-wide uppercase ring-2 ring-[#10A210] ring-offset-2 ring-offset-black";
          keyBtn.innerHTML =
            '<i class="fa-solid fa-calculator mr-2"></i> Enter PIN';
        }
      };

      // 3. Pin & Modal Logic
      window.addPin = (d) => {
        if (currentPin.length < 6) {
          currentPin += d;
          updatePinDisplay();
        }
      };
      window.clearPin = () => {
        currentPin = currentPin.substring(0, currentPin.length - 1);
        updatePinDisplay();
      };
      function updatePinDisplay() {
        document.getElementById("pinDisplay").innerText = currentPin;
      }

      function showModal(success, title, msg) {
        const m = document.getElementById("resultModal");
        const c = document.getElementById("modalCard");
        const bg = document.getElementById("modalIconBg");
        const ic = document.getElementById("modalIcon");
        const t = document.getElementById("modalTitle");

        t.innerText = title;
        t.className = success
          ? "text-3xl font-bold mb-3 text-green-500"
          : "text-3xl font-bold mb-3 text-red-500";
        document.getElementById("modalMsg").innerText = msg;

        bg.className = success
          ? "w-24 h-24 rounded-full flex items-center justify-center mb-6 text-5xl bg-green-900/50 text-green-400"
          : "w-24 h-24 rounded-full flex items-center justify-center mb-6 text-5xl bg-red-900/50 text-red-400";
        ic.className = success ? "fa-solid fa-check" : "fa-solid fa-xmark";

        m.classList.remove("hidden");
        requestAnimationFrame(() => {
          m.classList.remove("opacity-0");
          c.classList.remove("scale-90");
          c.classList.add("scale-100");
        });
      }

      window.closeModal = () => {
        const m = document.getElementById("resultModal");
        const c = document.getElementById("modalCard");
        m.classList.add("opacity-0");
        c.classList.remove("scale-100");
        c.classList.add("scale-90");
        setTimeout(() => {
          m.classList.add("hidden");
          clearPin();
        }, 300);
      };

      window.submitPin = async () => {
        if (currentPin.length === 0) return;
        document.getElementById("pinStatus").innerText = "Verifying...";
        try {
          const snap = await get(
            ref(db, `/rooms/${ROOM_ID}/active_codes/${currentPin}`)
          );
          if (snap.exists()) {
            const data = snap.val();
            const now = Math.floor(Date.now() / 1000);
            if (now >= data.start_time && now <= data.end_time) {
              showModal(true, "ACCESS GRANTED", "Door unlocked. Welcome!");
              const cmd = ref(db, `/rooms/${ROOM_ID}/manual_command`);
              await set(cmd, {
                device: "LOCK",
                state: true,
                timestamp: Date.now(),
              });
              if (data.use_lights)
                setTimeout(
                  () =>
                    set(cmd, {
                      device: "LIGHT",
                      state: true,
                      timestamp: Date.now(),
                    }),
                  500
                );
              await set(
                ref(
                  db,
                  `/rooms/${ROOM_ID}/active_codes/${currentPin}/has_checked_in`
                ),
                true
              );
            } else
              showModal(false, "ACCESS DENIED", "Code not valid at this time.");
          } else showModal(false, "ACCESS DENIED", "Invalid PIN.");
        } catch (e) {
          showModal(false, "ERROR", "Network Error");
        }
        document.getElementById("pinStatus").innerText = "Enter 6-digit PIN";
      };

      // 4. Schedule Logic (Full Width Cards)
      onValue(ref(db, `/rooms/${ROOM_ID}/active_codes`), (s) => {
        bookings = s.val()
          ? Object.values(s.val()).map((b) =>
              typeof b === "string" ? JSON.parse(b) : b
            )
          : [];
        renderSchedule();
      });
      setInterval(renderSchedule, 60000);

      function renderSchedule() {
        const list = document.getElementById("scheduleList");
        list.innerHTML = "";
        const now = new Date();
        const currentHour = now.getHours();
        let isOccupied = false;

        if (currentHour > 21) {
          list.innerHTML = `<div class="text-center text-gray-500 py-20 text-xl font-light">No more slots today.</div>`;
          return;
        }

        for (let h = currentHour; h <= 21; h++) {
          const start = new Date();
          start.setHours(h, 0, 0, 0);
          const end = new Date();
          end.setHours(h + 1, 0, 0, 0);
          let bookedBy = null;

          bookings.forEach((b) => {
            if (
              b.start_time * 1000 < end.getTime() &&
              b.end_time * 1000 > start.getTime()
            ) {
              bookedBy = b.created_by ? b.created_by.split("@")[0] : "User";
              if (h === currentHour) isOccupied = true;
            }
          });

          const timeStr = start.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
          });
          const isBooked = bookedBy !== null;

          // Styles for full-width cards
          const card = document.createElement("div");
          card.className = `w-full p-6 md:p-8 flex justify-between items-center rounded-2xl bg-[#212424] border-l-8 transition hover:bg-[#2a2d2d] shadow-md ${
            isBooked ? "border-red-600" : "border-green-600"
          }`;

          card.innerHTML = `
                    <div class="flex flex-col gap-1">
                        <span class="text-2xl md:text-3xl font-mono font-bold text-gray-100 tracking-wide">${timeStr}</span>
                        <span class="text-base md:text-lg text-gray-400 font-light">${
                          isBooked ? bookedBy : "Available"
                        }</span>
                    </div>
                    <div class="px-6 py-2 rounded-lg text-sm md:text-base font-bold tracking-widest uppercase shadow-sm ${
                      isBooked
                        ? "bg-red-900/50 text-red-200"
                        : "bg-green-900/50 text-green-200"
                    }">
                        ${isBooked ? "BOOKED" : "FREE"}
                    </div>`;
          list.appendChild(card);
        }

        const b = document.getElementById("statusBadge");
        b.innerText = isOccupied ? "OCCUPIED" : "AVAILABLE";
        b.className = `px-6 py-2 rounded-full text-sm md:text-base font-bold tracking-wide shadow-lg text-white ${
          isOccupied ? "bg-red-600" : "bg-green-600"
        }`;
      }
    </script>
  </body>
</html>
